<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    header { text-align: center; margin-bottom: 20px; }
    nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    nav a { color: #0088ff; text-decoration: none; padding: 8px 12px; background: #222; border-radius: 5px; font-weight: bold; }
    nav a:hover { background: #333; }
    .section { margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card h3 { font-size: 1rem; margin-top: 0; margin-bottom: 10px; color: #f0f0f0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .loading { text-align: center; font-size: 1.2rem; margin-top: 50px; }
    .view-all-btn { display: inline-block; margin-top: 10px; color: #0088ff; text-decoration: none; font-size: 0.9rem; }
    .bg-status { font-size: 0.8rem; color: #888; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    
    <nav>
      <a href="#">🏠 Home</a>
      <a href="#/asia-express">Asia Express</a>
      <a href="#/insula-iubirii">Insula Iubirii</a>
    </nav>
  </header>

  <div id="loader" class="loading">Se încarcă rapid ultimele episoade...</div>
  <div id="app" style="display: none;"></div>

  <script>
    let cacheData = null;
    let fullDataLoaded = false;

    async function loadAllData() {
      if (cacheData && fullDataLoaded) return cacheData;

      // 1. Fast initial fetch (only 1 episode per show)
      if (!cacheData) {
        const fastRes = await fetch('/api/episodes?fast=true');
        cacheData = await fastRes.json();
        
        // Hide initial loader and show page instantly
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        route(); // Render instant view

        // 2. Background full fetch (all episodes)
        fetch('/api/episodes').then(res => res.json()).then(fullData => {
          cacheData = fullData;
          fullDataLoaded = true;
          
          // Re-render silent update if user navigates or is on home
          route();
        });
      }

      return cacheData;
    }

    function route() {
      const app = document.getElementById('app');
      const data = cacheData;
      if (!data) return;

      const hash = window.location.hash;

      if (hash === '#/asia-express') {
        const isPartial = !fullDataLoaded && data.asiaExpress.length === 1;
        app.innerHTML = renderShowPage('Asia Express Sezonul 9', data.asiaExpress, isPartial);
      } else if (hash === '#/insula-iubirii') {
        const isPartial = !fullDataLoaded && data.insulaIubirii.length === 1;
        app.innerHTML = renderShowPage('Insula Iubirii Sezonul 10', data.insulaIubirii, isPartial);
      } else {
        const latestAsia = data.asiaExpress.slice(0, 1);
        const latestInsula = data.insulaIubirii.slice(0, 1);

        app.innerHTML = `
          <div class="section">
            <h2>Asia Express Sezonul 9 (Ultimul Episod)</h2>
            ${renderCardGrid(latestAsia)}
            <a href="#/asia-express" class="view-all-btn">📂 Vezi toate episoadele Asia Express →</a>
          </div>
          <div class="section">
            <h2>Insula Iubirii Sezonul 10 (Ultimul Episod)</h2>
            ${renderCardGrid(latestInsula)}
            <a href="#/insula-iubirii" class="view-all-btn">📂 Vezi toate episoadele Insula Iubirii →</a>
          </div>
        `;
      }
    }

    function renderShowPage(title, items, isPartial) {
      return `
        <div class="section">
          <h2>${title}</h2>
          ${isPartial ? '<div class="bg-status">⏳ Se încarcă și restul episoadelor în fundal...</div>' : ''}
          ${renderCardGrid(items)}
        </div>
      `;
    }

    function renderCardGrid(items) {
      if (!items || items.length === 0) {
        return '<p style="text-align:center; color:#888;">Nu s-au găsit episoade.</p>';
      }

      const cardsHtml = items.map(item => `
        <div class="card">
          <h3>${item.title}</h3>
          <div class="video-container">
            <iframe src="${item.embedSrc}" allowfullscreen loading="lazy"></iframe>
          </div>
        </div>
      `).join('');

      return `<div class="grid">${cardsHtml}</div>`;
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('load', loadAllData);
  </script>
</body>
</html>
