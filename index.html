<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episoade Emisiuni</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h1, h2 { text-align: center; }
    .section { margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card h3 { font-size: 1rem; margin-top: 0; margin-bottom: 10px; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .loading { text-align: center; font-size: 1.2rem; margin-top: 50px; }
  </style>
</head>
<body>

  <h1>Episoade Recente</h1>
  <div id="loader" class="loading">Se încarcă episoadele...</div>

  <div id="content" style="display: none;">
    <div class="section">
      <h2>Asia Express Sezonul 9</h2>
      <div id="asia-express-list" class="grid"></div>
    </div>

    <div class="section">
      <h2>Insula Iubirii Sezonul 10</h2>
      <div id="insula-iubirii-list" class="grid"></div>
    </div>
  </div>

  <script>
    const API_URL = '/api/episodes';

    async function loadEpisodes() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        renderSection('asia-express-list', data.asiaExpress);
        renderSection('insula-iubirii-list', data.insulaIubirii);

        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (err) {
        document.getElementById('loader').innerText = 'Eroare la încărcarea datelor.';
      }
    }

    function renderSection(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">Nu s-au găsit episoade.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${item.title}</h3>
          <div class="video-container">
            <iframe src="${item.embedSrc}" allowfullscreen></iframe>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadEpisodes();
  </script>
</body>
</html>
