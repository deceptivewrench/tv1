<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    header { text-align: center; margin-bottom: 20px; }
    nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    nav a { color: #0088ff; text-decoration: none; padding: 8px 12px; background: #222; border-radius: 5px; font-weight: bold; }
    nav a:hover { background: #333; }
    .section { margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card h3 { font-size: 1rem; margin-top: 0; margin-bottom: 10px; color: #f0f0f0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .loading { text-align: center; font-size: 1.2rem; margin-top: 50px; }
    .view-all-btn { display: inline-block; margin-top: 10px; color: #0088ff; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1><a href="#" style="color: inherit; text-decoration: none;">TV Hub</a></h1>
    <nav>
      <a href="#">🏠 Home</a>
      <a href="#/asia-express">Asia Express</a>
      <a href="#/insula-iubirii">Insula Iubirii</a>
    </nav>
  </header>

  <div id="loader" class="loading">Se încarcă episoadele...</div>
  <div id="app" style="display: none;"></div>

  <script>
    let cacheData = null;

    async function fetchData() {
      if (!cacheData) {
        const response = await fetch('/api/episodes');
        cacheData = await response.json();
      }
      return cacheData;
    }

    async function route() {
      const app = document.getElementById('app');
      const loader = document.getElementById('loader');
      
      loader.style.display = 'block';
      app.style.display = 'none';

      const data = await fetchData();
      const hash = window.location.hash;

      loader.style.display = 'none';
      app.style.display = 'block';

      if (hash === '#/asia-express') {
        app.innerHTML = renderShowPage('Asia Express Sezonul 9 - Toate Episoadele', data.asiaExpress);
      } else if (hash === '#/insula-iubirii') {
        app.innerHTML = renderShowPage('Insula Iubirii Sezonul 10 - Toate Episoadele', data.insulaIubirii);
      } else {
        // Home view: show ONLY the single latest episode for each show
        const latestAsia = data.asiaExpress.slice(0, 1);
        const latestInsula = data.insulaIubirii.slice(0, 1);

        app.innerHTML = `
          <div class="section">
            <h2>Cele mai recente episoade</h2>
          </div>
          <div class="section">
            
            ${renderCardGrid(latestAsia)}
            
          </div>
          <div class="section">
            
            ${renderCardGrid(latestInsula)}
            
          </div>
        `;
      }
    }

    function renderShowPage(title, items) {
      return `
        <div class="section">
          <h2>${title}</h2>
          ${renderCardGrid(items)}
        </div>
      `;
    }

    function renderCardGrid(items) {
      if (!items || items.length === 0) {
        return '<p style="text-align:center; color:#888;">Nu s-au găsit episoade.</p>';
      }

      const cardsHtml = items.map(item => `
        <div class="card">
          <h3>${item.title}</h3>
          <div class="video-container">
            <iframe src="${item.embedSrc}" allowfullscreen></iframe>
          </div>
        </div>
      `).join('');

      return `<div class="grid">${cardsHtml}</div>`;
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('load', route);
  </script>
</body>
</html>
